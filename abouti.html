<html>
<head>
<style type="text/css">

body {
  background-color: #0b0f19; /* Dark background */
  display: flex;
  justify-content: center;   /* Screen ke center me alignment ke liye */
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background-color: #111625; /* Card ka thoda light background image jaisa */
  padding: 30px;
  border-radius: 16px;       /* Rounded corners */
  display: flex;
  flex-direction: column;    /* Isse sab kuch ek ke niche ek vertical aayega */
  gap: 20px;                 /* Icon aur text ke beech ka gap */
  width: 300px;              /* Card ki width */
}


.profile-icon {
  width: 100px;
  height: 100px;
  background-color: #6b52d6; /* Purple background */
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* The head of the icon */
.head {
  width: 24px;
  height: 24px;
  background-color: white;
  border-radius: 50%;
  margin-bottom: 6px;
  position: relative;
  top: 8px;
}

/* The shoulders/body of the icon */
.body {
  width: 50px;
  height: 25px;
  background-color: white;
  border-top-left-radius: 25px;
  border-top-right-radius: 25px;
  position: relative;
  top: 8px;
}
h1, h2, h3{
color:white;

}
span,a{
color:#6b52d6;
font-size:large;
  text-decoration: none;
	


}


</style>

</head>
<body>
  <div class="card">
    
    <div class="profile-icon">
       <div class="head"></div>
       <div class="body"></div>
    </div>

    <div class="content-box">
       <h1>About Me</h1>
       <h3>
         I am a passionate <br>Developer who loves <br>to build beautiful and <br>functional websites.
       </h3>
       <a href="viewabout.html" class="view-more-link">
         View More <span class="arrow">&rarr;</span>
       </a>
    </div>

  </div>
</body>

</html>>
